services:
  backend:
    build:
      context: ./backend
    container_name: sih-backend
    ports:
      - "5001:5001"
    volumes:
      - ./backend/reminders.json:/app/reminders.json
      - ./backend/telemetry.json:/app/telemetry.json
    restart: unless-stopped

  caregiver-dashboard:
    build:
      context: ./apps/caregiver_web_admin
    container_name: sih-caregiver-dashboard
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
